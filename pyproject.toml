[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actionreflex"
version = "0.1.0"
description = "A pre-execution gate for AI agent actions, powered by TypeSafe's System One (Jev) model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ali Nabipour" }
]
keywords = ["ai-agents", "guardrails", "llm", "agent-safety", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typesafe-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/eyenpi/actionreflex"
Issues = "https://github.com/eyenpi/actionreflex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/actionreflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
