[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actionreflex"
version = "0.2.0"
description = "Check every action your AI agent takes before it runs, using TypeSafe's Jev model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ali Nabipour" }
]
keywords = ["ai-agents", "guardrails", "llm", "agent-safety", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Pre-1.0 SDK: pinned to the minor versions this release is verified against.
    "typesafe-sdk>=0.6,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/eyenpi/actionreflex"
Issues = "https://github.com/eyenpi/actionreflex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/actionreflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: makes real calls to the TypeSafe API (needs TYPESAFE_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
